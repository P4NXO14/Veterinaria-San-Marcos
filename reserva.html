<body data-auth="true" data-role="cliente">
    <header>
        <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
        <button type="button" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">Menu</button>
        <nav class="menu-principal" aria-label="Navegacion principal">

    </header>
    <main class="contenedor-principal">
        <section><h1>Solicitar Cita</h1>
            <p>El dueño de mascota crea una solicitud. La recepcionista puede confirmarla o proponer otro horario.</p>
<form id="formCita" class="formulario-vertical" novalidate>

<label for="citaServicio">Servicio:</label>
<select id="citaServicio" required>
    <option value="">Seleccione un servicio</option>
</select>

<label for="citaMascota">Nombre de la mascota:</label>
<input id="citaMascota" type="text" maxlength="50" placeholder="Nombre de la mascota" required>

<label for="citaEspecie">Especie:</label>
<select id="citaEspecie" required>
    <option value="">Seleccione</option>
    <option>Perro</option>
    <option>Gato</option>
    <option>Ave</option>
    <option>Conejo</option>
</select>

<label for="citaMotivo">Motivo:</label>
<textarea id="citaMotivo" maxlength="300" rows="4" placeholder="Describe brevemente el motivo de la consulta" required></textarea>

<label for="citaFecha">Fecha solicitada:</label>
<input id="citaFecha" type="date" required>

<label for="citaHora">Hora solicitada:</label>
<input id="citaHora" type="time" required>

<button class="btn-principal" type="submit">Enviar solicitud</button>
<p id="citaMensaje" class="mensaje-formulario" aria-live="polite"></p>
</form>
</section>

<section class="seccion-separada">
    <h2>Estado de mis citas</h2>
    <div id="contenedor-citas"></div>
</section>
</main>
<footer>

</footer>

</body>
</html>
