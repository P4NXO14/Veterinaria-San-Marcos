<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-auth="true">
    <header>
        <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
        <button type="button" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">Menu</button>
        <nav class="menu-principal" aria-label="Navegacion principal">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="reserva.html">Mis Citas</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Iniciar Sesion</a>
        </nav>
    </header>

    <main class="contenedor-formulario">
        <section>
            <h1>Envianos tu consulta</h1>
            <form id="formContacto" class="formulario-vertical" novalidate>
                <label for="contactoNombre">Nombre:</label>
                <input type="text" id="contactoNombre" name="nombre" maxlength="100" autocomplete="name" placeholder="Ingresa tu nombre" required>

                <label for="contactoCorreo">Correo electronico:</label>
                <input type="email" id="contactoCorreo" name="correo" maxlength="100" autocomplete="email" placeholder="nombre@correo.cl" required>

                <label for="contactoMensaje">Comentario:</label>
                <textarea id="contactoMensaje" name="mensaje" rows="5" maxlength="500" placeholder="Escribe aqui tu consulta" required></textarea>

                <button type="submit" class="btn-principal">Enviar Mensaje</button>
                <p id="contacto-error" class="mensaje-formulario" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 Veterinaria San Marcos.</p></footer>

    <script src="js/sesion.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
