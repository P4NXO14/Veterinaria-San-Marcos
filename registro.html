<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-publica="true">
    <header>
        <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
        <button type="button" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">Menu</button>
        <nav class="menu-principal" aria-label="Navegacion principal">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="reserva.html">Mis Citas</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Iniciar Sesion</a>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h1>Registro de Usuario</h1>
            <form id="formRegistro" class="formulario-vertical" novalidate>
                <label for="rut">RUN (sin puntos ni guion):</label>
                <input type="text" id="rut" name="rut" maxlength="9" autocomplete="off" placeholder="Ejemplo: 123456789" required>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="50" autocomplete="given-name" placeholder="Ingresa tu nombre" required>

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" maxlength="100" autocomplete="family-name" placeholder="Ingresa tus apellidos" required>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correo" name="correo" maxlength="100" autocomplete="email" placeholder="nombre@correo.cl" required>
<label for="direccion">Direccion:</label>
                <input type="text" id="direccion" name="direccion" maxlength="300" autocomplete="street-address" placeholder="Ingresa tu direccion" required>

                <label for="registroPass">Contraseña (4 a 10 caracteres):</label>
                <input type="password" id="registroPass" name="password" minlength="4" maxlength="10" autocomplete="new-password" required>

                <label for="registroPassConfirmar">Confirmar contraseña:</label>
                <input type="password" id="registroPassConfirmar" name="passwordConfirmar" minlength="4" maxlength="10" autocomplete="new-password" required>

                <button type="submit" class="btn-principal">Registrarse</button>
                <p id="mensaje-error" class="mensaje-formulario" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 Veterinaria San Marcos.</p></footer>

    <script src="js/sesion.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
